name: Update YouTube Videos

on:
  schedule:
    # Runs every 24 hours at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and Update YouTube Videos
        env:
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID || 'UCqDfG4lWZ5OJgJSc2XK7g4A' }}
        run: node scripts/update-youtube-videos.js

      - name: Commit and Push if Changed
        run: |
          if git status --porcelain public/data/youtube-videos.json | grep -q "youtube-videos.json"; then
            echo "Changes detected in youtube-videos.json. Committing..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/youtube-videos.json
            git commit -m "chore(youtube): auto-update latest 4 youtube videos [skip ci]"
            git push
          else
            echo "No changes detected. youtube-videos.json is up to date."
          fi
